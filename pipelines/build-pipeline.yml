# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- develop

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  displayName: 'Installing .NET SDK'
  inputs:
    version: 10.x

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: build

- task: DotNetCoreCLI@2
  displayName: 'Tests'
  inputs:
    command: test